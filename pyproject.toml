[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "streaming_SFMs"
version = "0.1"
description = "Small toolkit for streaming ASR with SFMs"
readme = "README.md"
requires-python = ">=3.10.12"
license = { file = "LICENSE" }
keywords = ["Automatic Speech Recognition", "ASR", "Foundation Models", "SFM"]
authors = [
	{ name = "Gerard Mas Mollà", email = "gemamol@upv.es" },
]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Science/Research",
	"License :: OSI Approved :: Apache Software License",
	"Programming Language :: Python :: 3",
	"Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
	"numpy",
	"torch",
	"omegaconf>=2.3.0,<2.4",
	"librosa>=0.10",
	"tqdm",
	"levenshtein",
	"nemo-toolkit[asr]>=2.7.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/germol00/streaming_SFMs"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["streaming_SFMs*"]
